spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/api_monitor
    username: api_user
    password: api_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        use_sql_comments: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms


  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 минут
      cache-null-values: false

  docker:
    compose:
      enabled: false

logging:
  level:
    com.app: DEBUG
    com.app.mapper: TRACE
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} - %level - [%thread] - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} - %level - [%thread] - %logger{36} - %msg%n"

  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30

task:
  execution:
    pool:
      core-size: 5
      max-size: 10
      queue-capacity: 100
    thread-name-prefix: AsyncTask-
  scheduling:
    pool:
      size: 5
    thread-name-prefix: ScheduledTask-